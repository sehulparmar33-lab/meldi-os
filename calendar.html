
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meldi Calendar</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:20px;
 background:#101522;color:white;
 font-family:Arial,sans-serif;
}
.header{display:flex;justify-content:space-between;align-items:center}
h2{color:#38d9ff}
.card{
 background:#1c2638;padding:18px;
 border-radius:18px;margin-top:20px;
}
.nav{display:flex;justify-content:space-between;align-items:center}
button{
 background:#263c58;color:white;border:0;
 padding:10px 14px;border-radius:10px;
}
.days,.dates{
 display:grid;grid-template-columns:repeat(7,1fr);
 text-align:center;gap:8px;margin-top:18px;
}
.days{color:#38d9ff}
.date{padding:12px 0;border-radius:10px}
.date.active{background:#00a9d6;color:white}
.date.today{border:1px solid #38d9ff}
input{
 width:100%;padding:13px;margin:8px 0;
 border-radius:10px;border:0;
}
.add{background:#008eb8;width:100%;margin-top:8px}
#events{margin-top:15px}
.event{background:#263c58;padding:12px;margin:8px 0;border-radius:10px}
</style>
</head>
<body>

<div class="header">
<h2>📅 Meldi Calendar</h2>
<button onclick="location.href='index.html'">Home</button>
</div>

<div class="card">
<div class="nav">
<button onclick="changeMonth(-1)">❮</button>
<h3 id="month"></h3>
<button onclick="changeMonth(1)">❯</button>
</div>
<div class="days">
<div>Sun</div><div>Mon</div><div>Tue</div>
<div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
</div>
<div class="dates" id="dates"></div>
</div>

<div class="card">
<h3>➕ Add Event</h3>
<input id="eventDate" type="date">
<input id="eventName" placeholder="Event name">
<button class="add" onclick="addEvent()">Save Event</button>
<div id="events"></div>
</div>

<script>
let current=new Date();
let selected=new Date().toISOString().slice(0,10);
let events=JSON.parse(localStorage.getItem("meldiEvents")||"[]");

function render(){
 let y=current.getFullYear(),m=current.getMonth();
 document.getElementById("month").innerText=
 current.toLocaleString("en",{month:"long"})+" "+y;
 let first=new Date(y,m,1).getDay();
 let total=new Date(y,m+1,0).getDate();
 let html="";
 for(let i=0;i<first;i++)html+="<div></div>";
 for(let d=1;d<=total;d++){
 let date=y+"-"+String(m+1).padStart(2,"0")+"-"+String(d).padStart(2,"0");
 let cls="date";
 if(date===selected)cls+=" active";
 if(date===new Date().toISOString().slice(0,10))cls+=" today";
 html+=`<div class="${cls}" onclick="selectDate('${date}')">${d}</div>`;
 }
 document.getElementById("dates").innerHTML=html;
 showEvents();
}
function changeMonth(n){current.setMonth(current.getMonth()+n);render()}
function selectDate(d){
 selected=d;
 document.getElementById("eventDate").value=d;
 render();
}
function addEvent(){
 let name=document.getElementById("eventName").value.trim();
 let date=document.getElementById("eventDate").value;
 if(!name||!date){alert("Enter date and event name");return}
 events.push({name,date});
 localStorage.setItem("meldiEvents",JSON.stringify(events));
 document.getElementById("eventName").value="";
 selected=date;
 current=new Date(date+"T12:00:00");
 render();
}
function showEvents(){
 let list=events.filter(e=>e.date===selected);
 document.getElementById("events").innerHTML=
 "<h3>Events: "+selected+"</h3>"+
 (list.length?list.map(e=>`<div class="event">📌 ${e.name}</div>`).join(""):"No events");
}
document.getElementById("eventDate").value=selected;
render();
</script>
</body>
</html>
